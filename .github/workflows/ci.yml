# Build the image, run the tests inside it (including one real EnergyPlus run),
# then start the whole stack with docker compose exactly as on the workstation.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t simulation-service .

      - name: Unit and API tests
        run: |
          docker run --rm -e FOTON_BACKEND=reference -v "$PWD/tests:/app/tests" \
            simulation-service sh -c "pip install -q pytest && pytest -q tests"

      - name: Docker compose stack answers a request with an API key
        run: |
          # The same commands as the README, with a CI key and no GPU:
          # the override drops the NVIDIA reservation and Foton runs on the CPU.
          cp .env.example .env
          sed -i 's/^APP_KEYS=.*/APP_KEYS=ci:ci-key/; s/^FOTON_BACKEND=.*/FOTON_BACKEND=reference/' .env
          printf 'services:\n  daylight:\n    deploy: !reset {}\n' > ci.override.yml
          docker compose -f docker-compose.yml -f ci.override.yml up -d --wait
          docker compose ps
          # A tiny room at preview quality, so the CPU fallback answers in seconds.
          echo '{"room": {"footprint_coordinates": [[0,0],[4,0],[4,3],[0,3]], "wwr": 0.4,
                 "sensor_grid": {"x_dim": 1.0, "y_dim": 1.0}}, "daylight": {"quality": "preview"}}' > scripts/ci-room.json
          timeout 300 docker compose -f docker-compose.yml -f ci.override.yml run --rm -v "$PWD/scripts:/scripts" api \
            python /scripts/client.py --url http://api:8000 --key ci-key --path /v1/daylight --payload /scripts/ci-room.json

      - name: Logs if the stack failed
        if: failure()
        run: docker compose logs --tail 100
