# Deploy to the workstation on every push to main.
# Runs on a self-hosted runner installed there (see README → Deployment).
# Settings and secrets stay on the machine in /opt/simulation-service/.env.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: [self-hosted, simulation]
    env:
      COMPOSE_PROJECT_NAME: simulation-service
    steps:
      - uses: actions/checkout@v4

      - name: Use the workstation's settings
        run: cp /opt/simulation-service/.env .env

      - name: Build and restart
        run: docker compose up -d --build --remove-orphans

      - name: Wait until healthy
        run: |
          for i in $(seq 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 5
          done
          docker compose logs --tail 100
          exit 1

      - name: Clean up old images
        run: docker image prune -f
