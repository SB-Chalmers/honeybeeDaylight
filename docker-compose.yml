# Simulation service: API + Redis + two Celery workers.
#
#   cp .env.example .env    # set APP_KEYS
#   docker compose up -d --build
#
# Worker counts follow the hardware (worker/concurrency.py): two daylight
# processes per GPU and one EnergyPlus process per physical core.
# Worker processes are replaced after 200 jobs (WORKER_MAX_TASKS_PER_CHILD in
# worker/celery_app.py), so a slow leak cannot build up during a long class.

x-app: &app
  build: .
  image: simulation-service
  env_file: .env
  restart: unless-stopped
  depends_on: [redis]
  # Docker keeps container logs forever by default; cap them at 3 x 10 MB.
  logging: &logging
    options: {max-size: 10m, max-file: "3"}

services:
  redis:
    image: redis:7.4-alpine
    # Queue + short-lived results only: no persistence. When memory is full,
    # expire results first and never drop queued jobs.
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy volatile-ttl
    restart: unless-stopped
    logging: *logging

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-2}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  daylight:
    <<: *app
    command: sh -c 'exec celery -A worker.celery_app worker -Q daylight --concurrency "$$(python -m worker.concurrency daylight)" --loglevel INFO'
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all   # 'graphics' is needed for Vulkan
    # Needs the NVIDIA Container Toolkit on the host. Remove this block on a
    # machine without a GPU and Foton falls back to the CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  energy:
    <<: *app
    command: sh -c 'exec celery -A worker.celery_app worker -Q energy --concurrency "$$(python -m worker.concurrency energy)" --loglevel INFO'
